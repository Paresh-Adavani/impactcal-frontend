<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImpactCal — series picture menu preview</title><style>:root{
  --brand:#F57C00; --brand-d:#D96A00; --brand-l:#FF9A33; --brand-xl:#FFF3E6;
  --blue:#467FF7; --blue-d:#2E63D4; --blue-l:#E4EDFE; --navy:#1B3160; --sky:#6EC1E4;
  --ink:#333; --ink-2:#5A6672; --ink-3:#8B96A3;
  --ok:#0E8A4D; --ok-l:#E6F6EE; --warn:#B7791F; --warn-l:#FDF4E3; --bad:#C0392B; --bad-l:#FBEBE9;
  --line:#E2E6EB; --line-2:#CFD5DD; --card:#fff; --card-2:#F3F4F6; --bg:#F3F4F6;
  --r:10px; --sh:0 1px 3px rgba(27,49,96,.07),0 4px 16px rgba(27,49,96,.06);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* a display rule must never beat the hidden attribute */
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Poppins,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--blue-d)}
.mono,code{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* header */
header{background:var(--navy);color:#fff}
header .wrap{display:flex;align-items:center;gap:18px;padding:14px 20px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo span{color:var(--brand-l)}
.sub{font-size:12px;color:#A9B8D4;border-left:1px solid rgba(255,255,255,.2);padding-left:16px;line-height:1.35}
header nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header nav a,header nav button{background:transparent;border:1px solid rgba(255,255,255,.22);color:#E6ECF7;
  padding:7px 13px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
header nav a.on,header nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
header nav a:hover,header nav button:hover{border-color:var(--brand-l)}

/* steps */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.step{flex:1 1 170px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 14px;display:flex;gap:11px;align-items:center;cursor:pointer}
.step.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;
  font-size:13px;font-weight:600;color:var(--ink-2);flex:none}
.step.on .n{background:var(--brand);color:#fff}
.step b{display:block;font-size:13.5px;font-weight:600}
.step small{color:var(--ink-3);font-size:11.5px}

/* cards, forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card > h3{font-size:16px;margin-bottom:4px}
.card > p.hint{color:var(--ink-3);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;
  font:inherit;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input[readonly]{background:var(--card-2);color:var(--ink-2)}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.btn{background:var(--brand);color:#fff;border:0;padding:9px 17px;border-radius:7px;font:inherit;
  font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand-d)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2);font-weight:500}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand-d)}
.btn.blue{background:var(--blue)} .btn.blue:hover{background:var(--blue-d)}
.btn.sm{padding:5px 11px;font-size:12.5px}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{background:var(--card-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600;position:sticky;top:0;z-index:2}
tbody tr:hover{background:var(--brand-xl)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.sel{background:var(--blue-l)!important}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--card-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-l);color:var(--ok)} .pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.bad{background:var(--bad-l);color:var(--bad)} .pill.brand{background:var(--brand-xl);color:var(--brand-d)}
.note{background:var(--warn-l);border:1px solid var(--warn);border-left-width:3px;border-radius:7px;
  padding:11px 14px;font-size:13.5px;margin:12px 0}
.note.ok{background:var(--ok-l);border-color:var(--ok)}
.note.bad{background:var(--bad-l);border-color:var(--bad)}
.note.blue{background:var(--blue-l);border-color:var(--blue)}
.muted{color:var(--ink-3);font-size:12.5px}
.hidden{display:none!important}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* editable grid */
.grid-edit td[contenteditable]{background:#FFFDF7;outline:none}
.grid-edit td[contenteditable]:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--brand)}
.grid-edit td.dirty{background:var(--brand-xl);font-weight:600}

/* print */
@media print{
  header,nav,.noprint,.steps{display:none!important}
  body{background:#fff;font-size:11.5px}
  .card{box-shadow:none;border:0;padding:0;margin:0}
  .wrap{max-width:none;padding:0}
  @page{size:A4;margin:12mm}
}

/* ---------------- brand mark ---------------- */
.brandmark{height:34px;width:auto;background:#fff;padding:3px 7px;border-radius:5px}

/* ---------------- picture picker ---------------- */
.picker{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pick{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;
  text-align:center;transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column}
.pick:hover{border-color:var(--brand-l);box-shadow:var(--sh)}
.pick.on{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.pick .thumb{height:130px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#F7F8FA);
  border-radius:7px;overflow:hidden;margin-bottom:8px}
.pick .thumb img{max-width:100%;max-height:126px;object-fit:contain}
.pick b{font-size:13.5px;font-weight:600;line-height:1.35;display:block}
.pick small{color:var(--ink-3);font-size:11.5px}
.pick .badge{position:relative;top:-4px;font-size:10.5px;color:var(--brand-d);font-family:var(--mono)}

/* series picture menu */
.seriesh{margin:18px 0 2px;font-size:14px;font-weight:600}
.seriesbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.seriesbar .count{font-size:12.5px;color:var(--ink-2)}
.seriesbar .count b{color:var(--brand-d)}
.picker.series{grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:10px}
.picker.series .pick{padding:9px}
.picker.series .thumb{height:94px;margin-bottom:6px}
.picker.series .thumb img{max-height:90px}
.picker.series b{font-size:12.5px}
.picker.series small{font-size:11px;line-height:1.35;display:block;margin-top:2px}
.pick .code{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--brand-d);background:var(--brand-xl);border-radius:5px;padding:1px 7px;margin-bottom:4px}
.pick.on .code{background:var(--brand);color:#fff}
.pick .n{color:var(--ink-3);font-size:10.5px;font-family:var(--mono);margin-top:auto;padding-top:5px}
.pick[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.65)}
.pick[disabled]:hover{border-color:var(--line);box-shadow:none}

.dutyhead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.dutypic{max-width:270px;max-height:150px;object-fit:contain}

/* ---------------- sent overlay ---------------- */
.overlay{position:fixed;inset:0;background:rgba(27,49,96,.45);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:60;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sentbox{background:#fff;border-radius:16px;padding:34px 40px;text-align:center;max-width:420px;
  box-shadow:0 18px 60px rgba(27,49,96,.28);animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sentbox h3{font-size:19px;margin:6px 0 6px}
.sentbox p{margin:0 0 4px;font-size:14px}
.sentbox .btn{margin-top:16px}
.plane .env,.plane .flap{opacity:0}
.plane .ring{animation:ringdraw 1.1s ease-out forwards}
@keyframes ringdraw{to{stroke-dashoffset:0}}
.sending .env,.sending .flap{opacity:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.plane .env,.plane .flap{transform-origin:60px 60px}
.done .env,.done .flap{opacity:0;transition:opacity .2s}
.done .tick{animation:tickdraw .5s .15s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes tickdraw{to{stroke-dashoffset:0}}
.done .ring{stroke:#0E8A4D}
.failed .ring{stroke:var(--bad)}
.failed .env,.failed .flap{opacity:1;stroke:var(--bad)}

/* ---------------- A4 selection report ---------------- */
.a4{background:#fff;color:#1a1a1a;font-size:11pt;line-height:1.42}
.rpt-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2.5pt solid var(--brand);padding-bottom:7pt}
.rpt-logo{height:34pt}
.rpt-addr{font-size:8pt;color:#555;margin-top:5pt;line-height:1.45}
.rpt-meta{text-align:right;font-size:8.5pt;color:#555}
.rpt-title{font-size:13pt;font-weight:700;color:var(--navy);letter-spacing:.02em;margin-bottom:4pt}
.rpt-sec{font-size:8pt;letter-spacing:.13em;text-transform:uppercase;color:var(--brand-d);font-weight:700;
  border-bottom:.75pt solid #ddd;padding-bottom:2pt;margin:11pt 0 5pt}
.rpt-grid{display:grid;grid-template-columns:1fr 1fr;gap:18pt}
.rpt-pic{max-width:100%;max-height:98pt;object-fit:contain;margin-top:5pt}
table.kv{width:100%;border-collapse:collapse;font-size:9.5pt}
table.kv td{padding:2pt 8pt 2pt 0;vertical-align:top;border:0}
table.kv td:nth-child(odd){color:#666;white-space:nowrap;width:1%}
table.kv td:nth-child(even){font-weight:600}
table.kv.cols2{column-count:2;column-gap:24pt;display:block}
table.kv.cols3{column-count:3;column-gap:18pt;display:block}
table.kv.cols2 tr,table.kv.cols3 tr{display:flex;gap:8pt;break-inside:avoid}
table.kv.cols2 td,table.kv.cols3 td{display:block}
table.kv.cols2 td:nth-child(even),table.kv.cols3 td:nth-child(even){margin-left:auto;text-align:right}
.rpt-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;margin-top:3pt}
.rpt-tbl th{background:#F3F4F6;text-align:left;padding:4pt 6pt;font-size:8pt;text-transform:uppercase;
  letter-spacing:.06em;color:#555;border-bottom:.75pt solid #ccc}
.rpt-tbl td{padding:4pt 6pt;border-bottom:.5pt solid #eee}
.rpt-tbl td.n,.rpt-tbl th.n{text-align:right;font-family:var(--mono)}
.rpt-foot{margin-top:14pt;border-top:.75pt solid #ddd;padding-top:7pt;font-size:8.5pt;color:#555}
.rpt-sign{display:flex;justify-content:space-between;margin-top:26pt}

@media print{
  html,body{background:#fff}
  body > *{display:none !important}
  body > #report{display:block !important}
  #report{padding:0;margin:0}
  @page{size:A4 portrait;margin:14mm 13mm}
  .rpt-sec,.rpt-tbl tr,table.kv tr{break-inside:avoid}
}
</style></head>
<body style="padding:22px;background:var(--bg)">
<div class="card" style="max-width:1100px;margin:0 auto">
<h3>Restrict to series <span class="muted">(preview of the new picture menu)</span></h3>
<p class="hint">Click the pictures of the families you want. Up to 3. Leave them unpicked to search the whole catalogue.</p>
<div class="seriesbar"><span class="count" id="seriesCount"></span>
  <button class="btn ghost sm" type="button" id="seriesClear">Clear</button></div>
<div id="seriesGrid" class="picker series"></div>
<div class="grid" style="margin-top:16px;max-width:640px">
  <div><label>Restrict to series <span class="muted">(list, same setting)</span></label>
  <select id="series" multiple size="4"></select></div>
</div>
</div>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = {}, save = () => {};
const META = { series: [{series: 'AC', n: 32}, {series: 'ACX', n: 10}, {series: 'AD', n: 27}, {series: 'AKHG', n: 65}, {series: 'AKHS', n: 7}, {series: 'ED', n: 77}, {series: 'EI', n: 32}, {series: 'JHQC', n: 24}, {series: 'SB', n: 21}, {series: 'YSRA', n: 4}] };
const CB_IMG = 'https://www.cranebuffer.com/wp-content/uploads/';
const AT_IMG = 'https://www.adonitech.co.in/wp-content/uploads/';
/* picture, what the family is, one line on how it works */
const SERIES_ART = {
  AC  :[AT_IMG+'2026/02/precision__3___1_-removebg-preview.png','Fixed damping',
        'Self-compensating. Damping set at the factory — pick the code 0–4 to suit the load.'],
  ACX :[AT_IMG+'2024/12/Industrial-Shock-Absorbers-2-300x200.png','Fixed damping, extended',
        'Self-compensating, more energy per cycle in the same thread size.'],
  AD  :[AT_IMG+'2025/03/DSC_2230-removebg-preview-1-1-212x300.png','Adjustable damping',
        'Damping set on installation by turning the adjustment ring.'],
  YSRA:[AT_IMG+'2025/01/industrial-shock-absorber-two-locknuts-221x300.jpg','Hydraulic, small bore',
        'Compact threaded hydraulic absorber, mounted with locknuts.'],
  AKHG:[CB_IMG+'2025/01/adonitech__7_-220x300.jpg','Hydraulic, nitrogen return',
        'Heavy crane buffer. A nitrogen chamber pushes the rod back out after impact.'],
  AKHS:[CB_IMG+'2025/02/adonitech__7___2_-removebg-preview.png','Hydraulic, spring return',
        'Heavy crane buffer. A return spring replaces the gas chamber.'],
  ED  :[CB_IMG+'2025/01/1-removebg-preview-300x200.png','Hydraulic crane buffer',
        'Heavy-duty buffer for crane and wagon end stops.'],
  EI  :[CB_IMG+'2025/01/adonitech__7_-1.jpg','Hydraulic crane buffer',
        'Industrial-duty buffer for travelling machinery.'],
  SB  :[CB_IMG+'2025/02/IMG-20250211-WA0009-221x300.jpg','Steel coil spring',
        'Spring buffer. Stores the energy and gives it back — efficiency 0.50.'],
  JHQC:[CB_IMG+'2026/01/1111-300x249.jpg','Polyurethane, non-metallic',
        'Bolted elastomer pad, no moving parts — efficiency 0.158.'],
};
const SERIES_MAX = 3;
/* ---------------- series picture menu (pick up to 3) ---------------- */
function selectedSeries() { return [...$('#series').selectedOptions].map(o => o.value); }
function setSeries(list) {
  const keep = [...new Set(list)].slice(0, SERIES_MAX);
  [...$('#series').options].forEach(o => { o.selected = keep.includes(o.value); });
  S.series = keep; save(); drawSeries();
}

$('#series').innerHTML = META.series.map(s => `<option value="${s.series}">${s.series} (${s.n})</option>`).join('');
$('#series').onchange = () => setSeries(selectedSeries());
$('#seriesClear').onclick = () => setSeries([]);
setSeries([]);
</script></body></html>
